name: Upload probe
on: workflow_dispatch
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_id=$(gh api "repos/$GITHUB_REPOSITORY" --jq .id)
          status=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/json' \
            --data-binary @probe.mp4 \
            "https://uploads.github.com/user-attachments/assets?name=probe.mp4&content_type=video%2Fmp4&repository_id=$repo_id")
          echo "HTTP $status"; cat resp.json; echo
          which ffmpeg ffprobe || echo "no ffmpeg on runner"
